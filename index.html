<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sarvesh">
    <meta name="description" content="Weather App project built with HTML, CSS, and JavaScript.">
    <title>Weather App</title>

    <!--css links -->

    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/main.css">

    <!--Google fonts-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

</head>
<body>
<header>
<div>
    <div class="weather-txt">WEATHER</div>
    <div class="dashboard-txt">Dashboard</div>
</div>
    <button class="search-btn">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon">
             <path d="M16.6725 16.6412L21 21M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="#7eb8f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span>Search city</span>
    </button>

</header>
<div class="search-section">
    <div class="search-box">
       <svg  width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  style="color: rgb(142, 175, 212);"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" placeholder="Search cities...">
    </div>
    <div class="search-suggestion">
        <button class="search-suggestion-btn search-suggestion-btn-active">
            <div class="search-suggestion-btn-left-section">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: rgb(126, 184, 247);"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span class="city-name">New York</span>
                <span class="country-code">US</span>
            </div>
            <div class="search-suggestion-btn-right-section">18°C</div>
        </button>
        <button class="search-suggestion-btn">
            <div class="search-suggestion-btn-left-section">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: rgb(126, 184, 247);"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span class="city-name">London</span>
                <span class="country-code">GB</span>
            </div>
            <div class="search-suggestion-btn-right-section">12°C</div>
        </button>
        <button class="search-suggestion-btn">
            <div class="search-suggestion-btn-left-section">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: rgb(126, 184, 247);"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span class="city-name">Tokyo</span>
                <span class="country-code">JP</span>
            </div>
            <div class="search-suggestion-btn-right-section">26°C</div>
        </button>
        <button class="search-suggestion-btn">
            <div class="search-suggestion-btn-left-section">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: rgb(126, 184, 247);"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span class="city-name">Sydney</span>
                <span class="country-code">AU</span>
            </div>
            <div class="search-suggestion-btn-right-section">22°C</div>
        </button>
    </div>
</div>
<main>
    <div class="weather-card">
        <div class="weather-card-location">
           <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
            <circle cx="12" cy="10" r="3"/>
            </svg>
            <span>New York, US</span>

        </div>
        <div class="weather-card-middle-section">
            <div>
              <div class="weather-card-temperature">18°</div>
              <div class="weather-card-weather-info"> Cloudy </div>
            </div>
         <div class="weather-card-icon">⛅</div>
        
        </div>
        
        <div class="weather-card-last-section">
            <div>
                <svg width="13" height="13" viewBox="0 0 24 24"  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>
                 <span>24°</span>
                 High
            </div>
            <div>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path></svg>
                <span>14°</span>
                Low
            </div>
            <div>Feels like <span>16°</span></div>
        </div>
    </div>
    <div class="details-card">
        <p>DETAILS</p>
        <div class="details-card-section">
            <div class="details-card-icon-section">
             <div class="details-card-icon-container">
                <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"></path><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"></path><path d="M9.8 4.4A2 2 0 1 1 11 8H2"></path></svg>
             </div>
             <span>Wind</span>
            </div>

            <div class="details-card-info-section">
                <div class="details-card-info-sub-section-1">
                    14 km/h
                </div>
                <div class="details-card-info-sub-section-2">
                    SW
                </div>
            </div>
        </div>
        <div class="details-card-section">
            <div class="details-card-icon-section">
             <div class="details-card-icon-container">
                
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"></path><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"></path></svg>
             </div>
             <span>Humidity</span>
            </div>

            <div class="details-card-info-section">
                <div class="details-card-info-sub-section-1">62%</div>
                <div class="details-card-info-sub-section-2">Moderate</div>
            </div>
        </div>
        <div class="details-card-section">
            <div class="details-card-icon-section">
             <div class="details-card-icon-container">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
             </div>
             <span>Visibility</span>
            </div>

            <div class="details-card-info-section">
                <div class="details-card-info-sub-section-1">10 km</div>
                <div class="details-card-info-sub-section-2">Clear</div>
            </div>
        </div>
        <div class="details-card-section">
            <div class="details-card-icon-section">
             <div class="details-card-icon-container">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
             </div>
             <span>UV Index</span>
            </div>

            <div class="details-card-info-section">
                <div class="details-card-info-sub-section-1">5</div>
                <div class="details-card-info-sub-section-2">Moderate</div>
            </div>
        </div>
        <div class="details-card-section">
            <div class="details-card-icon-section">
             <div class="details-card-icon-container">
                <svg  width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"></path></svg>
             </div>
             <span>Pressure</span>
            </div>

            <div class="details-card-info-section">
                <div class="details-card-info-sub-section-1">1013 mb</div>
                <div class="details-card-info-sub-section-2">Normal</div>
            </div>
        </div>
       
    </div>
    <div class="hourly-card">
        <div class="hourly-card-head">
            <div class="hourly-card-head-tab">
                <button class="active-btn">Hourly</button>
                <button>7 Days</button>
                <button>Chart</button>
            </div>
            <button class="more-btn">More <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
        <div class="hourly-card-main">
            <div class="hourly-card-main-element">
                <span class="hourly-card-element-time">Now</span>
                <span class="hourly-card-element-icon">⛅</span>
                <span class="hourly-card-element-temperature">18°</span>
            </div>
            <div class="hourly-card-main-element">
                <span class="hourly-card-element-time">1PM</span>
                <span class="hourly-card-element-icon">🌤</span>
                <span class="hourly-card-element-temperature">20°</span>
            </div>
            <div class="hourly-card-main-element">
                <span class="hourly-card-element-time">2PM</span>
                <span class="hourly-card-element-icon">☀️</span>
                <span class="hourly-card-element-temperature">22°</span>
            </div>
            <div class="hourly-card-main-element">
                <span class="hourly-card-element-time">3PM</span>
                <span class="hourly-card-element-icon">☀️</span>
                <span class="hourly-card-element-temperature">23°</span>
            </div>
            <div class="hourly-card-main-element">
                <span class="hourly-card-element-time">4PM</span>
                <span class="hourly-card-element-icon">🌤</span>
                <span class="hourly-card-element-temperature">21°</span>
            </div>
            <div class="hourly-card-main-element">
                <span class="hourly-card-element-time">5PM</span>
                <span class="hourly-card-element-icon">⛅</span>
                <span class="hourly-card-element-temperature">19°</span>
            </div>
            <div class="hourly-card-main-element">
                <span class="hourly-card-element-time">6PM</span>
                <span class="hourly-card-element-icon">🌥</span>
                <span class="hourly-card-element-temperature">17°</span>
            </div>
            <div class="hourly-card-main-element">
                <span class="hourly-card-element-time">7PM</span>
                <span class="hourly-card-element-icon">🌑</span>
                <span class="hourly-card-element-temperature">15°</span>
            </div>
            <div class="hourly-card-main-element">
                <span class="hourly-card-element-time">8PM</span>
                <span class="hourly-card-element-icon">🌑</span>
                <span class="hourly-card-element-temperature">14°</span>
            </div>
        </div>
    </div>
    <div class="other-locations-card">
        <p>other locations</p>
        <div class="other-locations-card-main">
            <button class="other-locations-card-main-elements  other-locations-card-main-elements-active">
                <div class="other-locations-card-header">
                    <span class="country-code">US</span>
                    <span>🌍</span>
                </div>
                <div class="other-locations-card-country">
                    New York
                </div>
                <div class="other-locations-card-temperature">
                    <span class="weather-description">Cloudy</span>
                    <span class="weather-temperature">18°</span>
                </div>
            </button>
            <button class="other-locations-card-main-elements">
                <div class="other-locations-card-header">
                    <span class="country-code">GB</span>
                    <span>🌍</span>
                </div>
                <div class="other-locations-card-country">
                    London
                </div>
                <div class="other-locations-card-temperature">
                    <span class="weather-description">Rainy</span>
                    <span class="weather-temperature">12°</span>
                </div>
            </button>
            <button class="other-locations-card-main-elements">
                <div class="other-locations-card-header">
                    <span class="country-code">JP</span>
                    <span>🌍</span>
                </div>
                <div class="other-locations-card-country">
                    Tokyo
                </div>
                <div class="other-locations-card-temperature">
                    <span class="weather-description">Sunny</span>
                    <span class="weather-temperature">26°</span>
                </div>
            </button>
            <button class="other-locations-card-main-elements">
                <div class="other-locations-card-header">
                    <span class="country-code">AU</span>
                    <span>🌍</span>
                </div>
                <div class="other-locations-card-country">
                    Sydney
                </div>
                <div class="other-locations-card-temperature">
                    <span class="weather-description">Clear</span>
                    <span class="weather-temperature">24°</span>
                </div>
            </button>
            
        </div>
    </div>
</main>
    
</body>
</html>
